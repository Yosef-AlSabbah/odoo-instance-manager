name: Bug report
description: Something in the panel does not work as documented.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems must not be reported here**: follow SECURITY.md instead.
        Never paste `.env` files, passwords, deploy keys or links to instances that hold real data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel and go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Creating an instance
        - GitHub sync, deploy keys or submodules
        - Public links (tunnels) or gateway
        - Pause, start, restart or switch off
        - Lifetime, deletion or backups
        - Accounts, roles, sign-in or audit log
        - Monitoring
        - Installer (sudoo-install.sh)
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: odoo-version
    attributes:
      label: Odoo version of the instance
      options:
        - "18.0"
        - "19.0"
        - "20.0"
        - Not related to an instance
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Community
        - Enterprise
        - Not related to an instance
  - type: textarea
    id: logs
    attributes:
      label: Message and technical log
      description: The plain-language message and the technical log the panel showed. Remove any secrets first.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Server
      description: Output of `sudo sudoo-install check` and `sudo sudoo-install status` (the version you run).
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and the documentation.
          required: true
        - label: I removed all passwords, keys and private links from this report.
          required: true
