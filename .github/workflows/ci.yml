name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Pre-commit checks (black, ruff, mypy, shellcheck, uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the project and its development tools
        run: uv sync --frozen
      - name: Run every pre-commit hook on every file
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the panel's image (the documentation is copied in by the Dockerfile)
        run: docker build --tag sudoo:ci .
      - name: The image serves the documentation
        run: docker run --rm --entrypoint sh sudoo:ci -c 'test -f /app/documentation/README.md && test -f /app/documentation/docs/ADMIN_GUIDE.md'
      - name: Build the web app's image
        run: docker build --tag sudoo-web:ci web

  web:
    name: Web app (TypeScript, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  edge:
    name: Publish the edge images (main)
    # every push to main that passes the checks: ghcr.io/sudoo-sh/sudoo-{panel,web}:edge and :sha-<short commit>,
    # for servers that follow main (sudoo-install update --version edge)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, tests, docker, web]
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      tags: |
        type=edge,branch=main
        type=sha,prefix=sha-,format=short
