name: Images

# Builds, pushes and signs the two images (ghcr.io/sudoo-sh/sudoo-panel and sudoo-web) for linux/amd64 and
# linux/arm64, with SBOM and provenance attestations. Called by release.yml (version tags) and ci.yml (edge, from
# main); the caller gives the tags (docker/metadata-action syntax) and gets the two digests back.
on:
  workflow_call:
    inputs:
      tags:
        description: docker/metadata-action tag rules
        type: string
        required: true
    outputs:
      panel-digest:
        description: Digest of ghcr.io/sudoo-sh/sudoo-panel (sha256:...)
        value: ${{ jobs.digests.outputs.panel }}
      web-digest:
        description: Digest of ghcr.io/sudoo-sh/sudoo-web (sha256:...)
        value: ${{ jobs.digests.outputs.web }}

permissions:
  contents: read

jobs:
  build:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing (Sigstore)
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: sudoo-panel
            context: .
            title: Sudoo.sh panel
            description: The backend of Sudoo.sh, which runs Odoo instances on one Docker server.
          - name: sudoo-web
            context: web
            title: Sudoo.sh web
            description: The web app of Sudoo.sh, served by Caddy.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sudoo-sh/${{ matrix.name }}
          flavor: latest=false
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=Sudoo.sh
            org.opencontainers.image.authors=Yousef M. Y. Al Sabbah
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.documentation=https://github.com/Sudoo-sh/sudoo.sh/tree/main/docs
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - id: build
        name: Build and push (amd64, arm64) with SBOM and provenance
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign the image (keyless, by digest)
        env:
          IMAGE: ghcr.io/sudoo-sh/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: mkdir -p digests && printf '%s\n' "$DIGEST" > "digests/$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 1

  digests:
    name: Digests
    needs: build
    runs-on: ubuntu-latest
    outputs:
      panel: ${{ steps.read.outputs.panel }}
      web: ${{ steps.read.outputs.web }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - id: read
        run: |
          echo "panel=$(cat digests/sudoo-panel)" >> "$GITHUB_OUTPUT"
          echo "web=$(cat digests/sudoo-web)" >> "$GITHUB_OUTPUT"
          cat digests/*
