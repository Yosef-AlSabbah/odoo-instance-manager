# Sudoo.sh: the backend (sudoo-panel) and the web app (sudoo-web). Instances (odoo-*) and Cloudflare connectors
# (sudoo-connector-*) are separate containers that the backend manages: they are not part of this project, and
# recreating these two services never touches them.
#
# Each release attaches this file as compose.yaml with the images pinned by digest and without the build lines; that
# is the file a server uses (docs/ADMIN_GUIDE.md). In a clone of the repository, `docker compose build` builds the
# two images locally as sudoo-panel:local and sudoo-web:local (README, "From source").
name: sudoo-panel

services:
  manager:
    image: ${SUDOO_PANEL_IMAGE:-sudoo-panel:local}
    build: .
    container_name: sudoo-panel
    restart: unless-stopped
    # a small init process as PID 1: collects processes started with `docker exec`, so gunicorn does not
    # mistake them for its own workers, and passes stop signals on
    init: true
    env_file: .env
    # host networking: the panel, the gateway ports and the connectors share the server's network
    network_mode: host
    volumes:
      # the panel runs docker and docker compose against the host's Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # same path as on the host, so paths in the instances' compose files mean the same inside and outside
      - /opt/odoo:/opt/odoo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_PORT:-9002}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    # the web app (web/): the React front end, served by Caddy, which forwards /api, /hooks and /docs to the
    # backend on 127.0.0.1:API_PORT and the live events to 127.0.0.1:EVENTS_PORT
    image: ${SUDOO_WEB_IMAGE:-sudoo-web:local}
    build: ./web
    container_name: sudoo-web
    restart: unless-stopped
    network_mode: host
    # only what the web service needs, never the secrets in .env (values come from .env when Compose starts it)
    environment:
      EXPOSURE: ${EXPOSURE:-cloudflare-quick}
      PANEL_PORT: ${PANEL_PORT:-9000}
      API_PORT: ${API_PORT:-9002}
      EVENTS_PORT: ${EVENTS_PORT:-9001}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PANEL_PORT:-9000}/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - manager
