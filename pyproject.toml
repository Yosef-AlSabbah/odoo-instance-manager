[project]
name = "sudoo"
version = "1.0.0"
description = "Web panel that runs many independent Odoo instances on one Docker server, from any Git branch."
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Yousef M. Y. Al Sabbah" }]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Flask",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "aiohttp>=3.10",
    "cryptography>=43",
    "flask>=3.0",
    "gunicorn>=23.0",
    "markdown>=3.7",
    "pydantic-settings>=2.6",
]

[project.urls]
Repository = "https://github.com/Sudoo-sh/sudoo.sh"
Documentation = "https://github.com/Sudoo-sh/sudoo.sh/tree/main/docs"

[project.scripts]
"sudoo.sh" = "sudoo.cli:main"
sudoo = "sudoo.cli:main"  # the earlier name, kept so existing scripts keep working

# ---------------------------------------------------------------- plugins (see docs/PLUGINS.md)
[project.entry-points."sudoo.exposure"]
cloudflare-quick = "sudoo.exposure.cloudflare:CloudflareQuickTunnel"
host-ports = "sudoo.exposure.ports:HostPorts"

[project.entry-points."sudoo.addon_sources"]
folder = "sudoo.addons.folder:FolderSource"
git = "sudoo.addons.git:GitSource"

[project.entry-points."sudoo.storage"]
sqlite = "sudoo.storage.sqlite:SqliteStorage"

[project.entry-points."sudoo.auth"]
local = "sudoo.auth.local:LocalAccounts"

[project.entry-points."sudoo.second_factors"]
email = "sudoo.auth.email_code:EmailCode"
totp = "sudoo.auth.totp:AuthenticatorApp"

[project.entry-points."sudoo.mailers"]
smtp = "sudoo.mail.smtp:Smtp"
none = "sudoo.mail.none:NoMail"

[project.entry-points."sudoo.rate_limiters"]
memory = "sudoo.limits.memory:MemoryRateLimiter"

[project.entry-points."sudoo.update_triggers"]
polling = "sudoo.triggers.polling:Polling"
github-webhook = "sudoo.triggers.github_webhook:GitHubWebhook"

[dependency-groups]
dev = [
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-markdown",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoo"]

# ---------------------------------------------------------------- code style and checks
[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, modern syntax, simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]  # black decides line length

[tool.ruff.lint.isort]
known-first-party = ["sudoo"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
